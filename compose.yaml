services:
  cubic-root:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - METRICS_PORT=9090
      - DEBUG=true
      # VictoriaTraces accepts OTLP at /insert/opentelemetry/v1/traces. The generic
      # OTEL_EXPORTER_OTLP_ENDPOINT doesn't fit: the SDK appends /v1/traces to it.
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://victoriatraces:10428/insert/opentelemetry/v1/traces
      # Lower the ratio for load tests, e.g. TRACES_SAMPLE_RATIO=0.01 make obs-up
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=${TRACES_SAMPLE_RATIO:-1.0}
      # Response cache (CACHE_SIZE=0 disables it) and an artificial delay of the
      # computation on cache misses, e.g. CALC_DELAY=2ms make obs-up
      - CACHE_SIZE=${CACHE_SIZE:-10000}
      - CACHE_TTL=${CACHE_TTL:-5m}
      - CALC_DELAY=${CALC_DELAY:-0s}
      - CALC_DELAY_JITTER=${CALC_DELAY_JITTER:-0s}
    depends_on:
      victoriatraces:
        condition: service_started
      # Vector only ships lines emitted after it attaches to the container:
      # start the app once Vector is ready, otherwise startup logs are lost.
      vector:
        condition: service_healthy
  # --- Tracing ---
  victoriatraces:
    image: victoriametrics/victoria-traces:v0.12.0
    ports:
      - "10428:10428" # OTLP HTTP ingestion, Jaeger/Tempo query APIs, UI at /select/vmui
    command:
      - -retentionPeriod=1d
  # --- Logs ---
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    ports:
      - "9428:9428" # ingestion and query APIs, UI at /select/vmui
    command:
      - -retentionPeriod=1d
  vector:
    image: timberio/vector:0.59.0-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/vector/vector.yaml:/etc/vector/vector.yaml:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8686/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      - victorialogs
  # --- Metrics ---
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    ports:
      - "8428:8428" # query API, UI at /vmui
    command:
      - -retentionPeriod=1d
      # Queries hide the last 30s by default to avoid incomplete data from delayed
      # ingestion. Locally vmagent pushes within a second, so a shorter offset lets
      # graphs react to a curl right away.
      - -search.latencyOffset=5s
  vmagent:
    image: victoriametrics/vmagent:v1.154.0
    ports:
      - "8429:8429" # scrape targets at /targets
    volumes:
      - ./observability/vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
    depends_on:
      - victoriametrics
  vmalert:
    image: victoriametrics/vmalert:v1.154.0
    ports:
      - "8880:8880" # rules and alerts UI
    volumes:
      - ./observability/vmalert/rules:/etc/vmalert/rules:ro
    command:
      - -rule=/etc/vmalert/rules/*.yml
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      # No Alertmanager in the local stack: alerts are visible in the vmalert UI and Grafana.
      - -notifier.blackhole
    depends_on:
      - victoriametrics
  # --- Visualization ---
  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3333:3000"
    environment:
      # Login required. Override credentials via GRAFANA_ADMIN_USER /
      # GRAFANA_ADMIN_PASSWORD (e.g. in a local .env file).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Installed before Grafana starts, so provisioned datasources can resolve their types.
      - GF_PLUGINS_PREINSTALL_SYNC=victoriametrics-metrics-datasource@0.26.1,victoriametrics-logs-datasource@0.32.0
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Keeps downloaded plugins across `make obs-down` / `make obs-up`.
      - grafana-plugins:/var/lib/grafana/plugins
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces

volumes:
  grafana-plugins:
