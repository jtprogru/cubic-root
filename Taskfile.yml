# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: '3'

set:
  - pipefail

silent: false

vars:
  BASE_URL: "http://localhost:8080"
  K6_SCRIPT: "k6/load.js"
  K6_VUS: "50"
  K6_DURATION: "30s"

tasks:
  default:
    cmd: task --list

  build:bin:
    desc: Build binary
    cmd: go build -o bin/cubic-root main.go
    generates:
      - bin/cubic-root

  build:docker:
    desc: Build docker image
    cmd: docker build -t ghcr.io/jtprog/cubic-root:latest . --build-arg http_port=8080 --build-arg debug_mode=true

  push:docker:
    desc: Push docker image
    cmd: docker push ghcr.io/jtprog/cubic-root:latest

  tests:
    desc: Run all tests
    cmds:
      - echo "Running unit tests..."
      - task: "test:unit"
      - echo "Running benchmarks..."
      - task: "test:bench"

  test:unit:
    desc: Run unit tests
    cmd: go test -v -timeout 30s ./...

  test:bench:
    desc: Run benchmarks
    cmd: go test -bench=. -run=^$ -v

  run:bin:
    desc: Run binary
    cmd: "DEBUG=true ./bin/cubic-root"
    deps:
      - build:bin
    env:
      PORT: 8080

  test:load:
    desc: "Run load test using k6 (stages: ramp-up 30s → load 240s → ramp-down 30s)"
    cmds:
      - |
        if ! command -v k6 &> /dev/null; then
          echo "k6 is not installed: brew install k6"
          exit 1
        fi
      - k6 run --env BASE_URL={{.BASE_URL}} {{.K6_SCRIPT}}

  test:load:smoke:
    desc: "Smoke test: 1 VU, 10s — быстрая проверка что сервис отвечает"
    cmds:
      - |
        if ! command -v k6 &> /dev/null; then
          echo "k6 is not installed: brew install k6"
          exit 1
        fi
      - k6 run --vus 1 --duration 10s --env BASE_URL={{.BASE_URL}} {{.K6_SCRIPT}}

