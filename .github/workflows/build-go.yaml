name: Go

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      # You can test your matrix by printing the current Go version
      - name: Display Go version
        run: go version
      - name: Install dependencies
        run: |
          go get .
      - name: Build
        run: go build -v -o bin/cubic-root-${{ matrix.go-version }} ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Static security scan (gosec)
        # gosec v2.29.0 can't read Go 1.27 export data (securego/gosec#1774).
        # Pinned to a master commit with the fix; switch back to @latest once v2.30.0 is released.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261015133444-707f2271f665
          gosec ./...
      - name: Test with Go
        run: go test -json -coverprofile=coverage-${{ matrix.go-version }}.out ./... > TestResults-${{ matrix.go-version }}.json
      - name: Show coverage
        run: go tool cover -func=coverage-${{ matrix.go-version }}.out
      - name: Upload Go test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Go-results-${{ matrix.go-version }}
          path: TestResults-${{ matrix.go-version }}.json
