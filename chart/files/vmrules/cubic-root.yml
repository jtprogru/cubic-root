# SLI recording rules and SLO alerts for cubic-root.
#
# SLOs (30-day window):
#   availability — 99.9% of /cubic-root requests without 5xx;
#   latency      — 99% of successful /cubic-root requests faster than 10ms;
#   correctness  — 99.99% of computed results with relative error <= 1e-12.
#
# Burn-rate alerts follow the multi-window, multi-burn-rate approach of the
# Google SRE Workbook: a fast burn (14.4x over 1h, confirmed by 5m) pages, a slow
# burn (6x over 6h, confirmed by 30m) opens a ticket. The 5xx numerator falls back
# to 0 so that a service without errors reports 0 rather than no data.
groups:
  - name: cubic-root-sli
    interval: 30s
    rules:
      - record: job_http_route:http_server_requests:rate5m
        expr: sum by (job, http_route) (rate(http_server_request_duration_seconds_count{job="cubic-root"}[5m]))
      - record: job:http_server_request_duration_seconds:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (job, le) (
            rate(http_server_request_duration_seconds_bucket{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5.."}[5m])
          ))
      - record: job:cubic_root_calculations_bad:ratio_rate5m
        expr: |
          sum by (job) (rate(cubic_root_calculations_total{job="cubic-root", outcome=~"max_iter|degenerate"}[5m]))
          /
          sum by (job) (rate(cubic_root_calculations_total{job="cubic-root"}[5m]))
      - record: job:cubic_root_cache_hit:ratio_rate5m
        expr: |
          sum by (job) (rate(cubic_root_cache_requests_total{job="cubic-root", result="hit"}[5m]))
          /
          sum by (job) (rate(cubic_root_cache_requests_total{job="cubic-root"}[5m]))
      - record: job:cubic_root_availability_errors:ratio_rate5m
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code=~"5.."}[5m]))
            or
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[5m])) * 0
          )
          /
          sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[5m]))
      - record: job:cubic_root_availability_errors:ratio_rate30m
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code=~"5.."}[30m]))
            or
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[30m])) * 0
          )
          /
          sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[30m]))
      - record: job:cubic_root_availability_errors:ratio_rate1h
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code=~"5.."}[1h]))
            or
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[1h])) * 0
          )
          /
          sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[1h]))
      - record: job:cubic_root_availability_errors:ratio_rate6h
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code=~"5.."}[6h]))
            or
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[6h])) * 0
          )
          /
          sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root"}[6h]))
      - record: job:cubic_root_latency_slow:ratio_rate5m
        expr: |
          1 - (
            sum by (job) (rate(http_server_request_duration_seconds_bucket{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5..", le="0.01"}[5m]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5.."}[5m]))
          )
      - record: job:cubic_root_latency_slow:ratio_rate30m
        expr: |
          1 - (
            sum by (job) (rate(http_server_request_duration_seconds_bucket{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5..", le="0.01"}[30m]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5.."}[30m]))
          )
      - record: job:cubic_root_latency_slow:ratio_rate1h
        expr: |
          1 - (
            sum by (job) (rate(http_server_request_duration_seconds_bucket{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5..", le="0.01"}[1h]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5.."}[1h]))
          )
      - record: job:cubic_root_latency_slow:ratio_rate6h
        expr: |
          1 - (
            sum by (job) (rate(http_server_request_duration_seconds_bucket{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5..", le="0.01"}[6h]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count{job="cubic-root", http_route="/cubic-root", http_response_status_code!~"5.."}[6h]))
          )
      - record: job:cubic_root_incorrect_results:ratio_rate5m
        expr: |
          1 - (
            sum by (job) (rate(cubic_root_result_relative_error_bucket{job="cubic-root", le="1e-12"}[5m]))
            /
            sum by (job) (rate(cubic_root_result_relative_error_count{job="cubic-root"}[5m]))
          )
      - record: job:cubic_root_incorrect_results:ratio_rate30m
        expr: |
          1 - (
            sum by (job) (rate(cubic_root_result_relative_error_bucket{job="cubic-root", le="1e-12"}[30m]))
            /
            sum by (job) (rate(cubic_root_result_relative_error_count{job="cubic-root"}[30m]))
          )
      - record: job:cubic_root_incorrect_results:ratio_rate1h
        expr: |
          1 - (
            sum by (job) (rate(cubic_root_result_relative_error_bucket{job="cubic-root", le="1e-12"}[1h]))
            /
            sum by (job) (rate(cubic_root_result_relative_error_count{job="cubic-root"}[1h]))
          )
      - record: job:cubic_root_incorrect_results:ratio_rate6h
        expr: |
          1 - (
            sum by (job) (rate(cubic_root_result_relative_error_bucket{job="cubic-root", le="1e-12"}[6h]))
            /
            sum by (job) (rate(cubic_root_result_relative_error_count{job="cubic-root"}[6h]))
          )

  - name: cubic-root-slo
    interval: 30s
    rules:
      - alert: CubicRootAvailabilityBudgetBurnFast
        expr: |
          job:cubic_root_availability_errors:ratio_rate1h > 0.0144
          and
          job:cubic_root_availability_errors:ratio_rate5m > 0.0144
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Availability SLO error budget burns 14.4x faster than allowed"
          description: >-
            SLO: 99.9% of /cubic-root requests are answered without 5xx. Over the last 1h the bad share is
            {{ $value | humanizePercentage }} (threshold 0.0144, 14.4x the
            0.001 budget); the 5m window confirms it is still happening.
            Check the Overview and Logs dashboards: 5xx by status class and error logs ({service="cubic-root"} level:(ERROR OR WARN)).
      - alert: CubicRootAvailabilityBudgetBurnSlow
        expr: |
          job:cubic_root_availability_errors:ratio_rate6h > 0.006
          and
          job:cubic_root_availability_errors:ratio_rate30m > 0.006
        for: 15m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Availability SLO error budget burns 6x faster than allowed"
          description: >-
            SLO: 99.9% of /cubic-root requests are answered without 5xx. Over the last 6h the bad share is
            {{ $value | humanizePercentage }} (threshold 0.006, 6x the
            0.001 budget); the 30m window confirms it is still happening.
            Check the Overview and Logs dashboards: 5xx by status class and error logs ({service="cubic-root"} level:(ERROR OR WARN)).
      - alert: CubicRootLatencyBudgetBurnFast
        expr: |
          job:cubic_root_latency_slow:ratio_rate1h > 0.144
          and
          job:cubic_root_latency_slow:ratio_rate5m > 0.144
        for: 2m
        labels:
          severity: critical
          slo: latency
        annotations:
          summary: "Latency SLO error budget burns 14.4x faster than allowed"
          description: >-
            SLO: 99% of successful /cubic-root requests are faster than 10ms. Over the last 1h the bad share is
            {{ $value | humanizePercentage }} (threshold 0.144, 14.4x the
            0.01 budget); the 5m window confirms it is still happening.
            Check slow traces on the Traces dashboard and scheduler latency on the Runtime dashboard: CPU saturation shows up there first.
      - alert: CubicRootLatencyBudgetBurnSlow
        expr: |
          job:cubic_root_latency_slow:ratio_rate6h > 0.06
          and
          job:cubic_root_latency_slow:ratio_rate30m > 0.06
        for: 15m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Latency SLO error budget burns 6x faster than allowed"
          description: >-
            SLO: 99% of successful /cubic-root requests are faster than 10ms. Over the last 6h the bad share is
            {{ $value | humanizePercentage }} (threshold 0.06, 6x the
            0.01 budget); the 30m window confirms it is still happening.
            Check slow traces on the Traces dashboard and scheduler latency on the Runtime dashboard: CPU saturation shows up there first.
      - alert: CubicRootCorrectnessBudgetBurnFast
        expr: |
          job:cubic_root_incorrect_results:ratio_rate1h > 0.00144
          and
          job:cubic_root_incorrect_results:ratio_rate5m > 0.00144
        for: 2m
        labels:
          severity: critical
          slo: correctness
        annotations:
          summary: "Correctness SLO error budget burns 14.4x faster than allowed"
          description: >-
            SLO: 99.99% of computed results have relative error |z^3-d|/|d| <= 1e-12. Over the last 1h the bad share is
            {{ $value | humanizePercentage }} (threshold 0.00144, 14.4x the
            0.0001 budget); the 5m window confirms it is still happening.
            Check calculations by outcome and the relative error heatmap on the Work and correctness dashboard.
      - alert: CubicRootCorrectnessBudgetBurnSlow
        expr: |
          job:cubic_root_incorrect_results:ratio_rate6h > 0.0006
          and
          job:cubic_root_incorrect_results:ratio_rate30m > 0.0006
        for: 15m
        labels:
          severity: warning
          slo: correctness
        annotations:
          summary: "Correctness SLO error budget burns 6x faster than allowed"
          description: >-
            SLO: 99.99% of computed results have relative error |z^3-d|/|d| <= 1e-12. Over the last 6h the bad share is
            {{ $value | humanizePercentage }} (threshold 0.0006, 6x the
            0.0001 budget); the 30m window confirms it is still happening.
            Check calculations by outcome and the relative error heatmap on the Work and correctness dashboard.
      - alert: CubicRootNonConvergedResults
        expr: sum by (job) (increase(cubic_root_calculations_total{job="cubic-root", outcome=~"max_iter|degenerate"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "cubic-root computations did not converge"
          description: >-
            {{ $value | humanize }} computations in the last 10 minutes ended with max_iter or degenerate,
            clients got HTTP 500. The algorithm converges for every finite input, so this is a regression.
            Inputs are in ERROR logs: {service="cubic-root"} level:ERROR.
      - alert: CubicRootFaultInjectionEnabled
        expr: max by (job) (cubic_root_fault_injection_enabled{job="cubic-root"}) == 1
        labels:
          severity: info
        annotations:
          summary: "Fault injection is enabled in cubic-root"
          description: >-
            FAULT_* settings are active: errors and latency are injected on purpose, SLO alerts
            may fire because of the experiment.
