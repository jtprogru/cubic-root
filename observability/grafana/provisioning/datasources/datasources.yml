apiVersion: 1

# Grafana expands environment variables in provisioning files, so a bare
# ${__value.raw} or ${__trace.traceId} becomes an empty string. $$ keeps the
# Grafana macro literal.

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: victoriametrics-metrics-datasource
    url: http://victoriametrics:8428
    isDefault: true
    editable: false

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    url: http://victorialogs:9428
    editable: false
    jsonData:
      # Logs → Traces: trace_id is a regular log field (set by the app, lifted by Vector)
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: victoriatraces
          url: '$${__value.raw}'
          urlDisplayLabel: "View trace in VictoriaTraces"

  # Primary traces datasource: VictoriaTraces serves the stable Jaeger Query API.
  - name: VictoriaTraces
    uid: victoriatraces
    type: jaeger
    url: http://victoriatraces:10428/select/jaeger
    editable: false
    jsonData:
      # Traces → Logs: jump from a span to its logs in VictoriaLogs (Grafana >= 12.2)
      tracesToLogsV2:
        datasourceUid: victorialogs
        customQuery: true
        query: 'trace_id:="$${__trace.traceId}"'
      nodeGraph:
        enabled: true

  # VictoriaTraces stores spans as VictoriaLogs records, so the VictoriaLogs plugin
  # runs LogsQL over them: RED and duration quantiles by span name or attribute
  # without a separate span-metrics generator.
  - name: VictoriaTraces (LogsQL)
    uid: victoriatraces-logsql
    type: victoriametrics-logs-datasource
    url: http://victoriatraces:10428
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: victoriatraces
          url: '$${__value.raw}'
          urlDisplayLabel: "View trace"

  # Experimental: Tempo-compatible API of VictoriaTraces for TraceQL and Traces Drilldown.
  - name: VictoriaTraces (Tempo API)
    uid: victoriatraces-tempo
    type: tempo
    url: http://victoriatraces:10428/select/tempo
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        customQuery: true
        query: 'trace_id:="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
