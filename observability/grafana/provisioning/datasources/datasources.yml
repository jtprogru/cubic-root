apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      # Traces → Logs: jump from a span in Tempo to matching logs in Loki
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        # trace_id is a Loki stream label (set by Promtail pipeline)
        query: '{container=~"cubic-root.*", trace_id="${__trace.traceId}"}'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    editable: false
    jsonData:
      # Logs → Traces: trace_id is already a Loki label — link it to Tempo
      derivedFields:
        - datasourceUid: tempo
          matcherType: label
          matcherValue: trace_id
          name: TraceID
          url: '${__value.raw}'
          urlDisplayLabel: "View trace in Tempo"
