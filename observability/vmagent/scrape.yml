global:
  scrape_interval: 5s

scrape_configs:
  - job_name: cubic-root
    static_configs:
      - targets: ["cubic-root:9090"]
    metrics_path: /metrics

  # Self-monitoring of the observability stack.
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]
  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]
  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]
  - job_name: victoriatraces
    static_configs:
      - targets: ["victoriatraces:10428"]
  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]
